<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons - Etape 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Conteneur du tableau -->
    <div id="table_container">

        <!-- Formulaire de saisie -->
        <div id="form_container">
            <div class="form_group">
                <label class="form_label">Nom:</label>
                <input type="text" id="form_nom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Prénom:</label>
                <input type="text" id="form_prenom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Points:</label>
                <input type="number" id="form_points" class="form_field"/>
            </div>
            <button class="btn-add" onclick="doNewData()">
                Ajouter
            </button>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_chkbox">Select</th>
                </tr>
            </thead>
        </table>

        <!-- Espace résumé -->
        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Totale point(s)= 0</p>
        </div>

        <!-- Boutons de contrôle -->
        <div id="container_btn">
            <!-- Fonctionnalité supplémentaire 1 : tout cocher / décocher -->
            <button class="btn-select" onclick="toggleSelectAll()">
                Tout cocher
            </button>
            <button class="btn-consol" onclick="consoleTableau()">
                Console Tableau
            </button>
            <button class="btn-del" onclick="deleteRow()">
                Supprimer
            </button>
        </div>
    </div>

    <!-- Script externe -->
    <script src="script.js"></script>
</body>
</html>
